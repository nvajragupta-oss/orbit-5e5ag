<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Space Math</title>
    <meta name="description" content="A space-themed math practice game for kids that works offline." />
    <meta name="theme-color" content="#0b1033" />
    <!-- Private family app: ask search engines not to list it -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="dark" />

    <!-- Install as an app (iPhone / iPad / Android / desktop) -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Space Math" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="sky" aria-hidden="true"></div>

    <header id="topbar">
      <button id="btn-back" class="icon-btn" type="button" aria-label="Back">←</button>
      <h1 id="title"></h1>
      <button id="btn-speak" class="icon-btn" type="button" aria-label="Say it again">🔊</button>
    </header>

    <main id="screen" class="screen"></main>

    <footer id="subtitle" role="status" aria-live="polite" title="Tap to hear it again">
      <span class="mascot" aria-hidden="true">👽</span>
      <p id="subtitle-text"></p>
    </footer>

    <div id="modal-root"></div>

    <noscript>
      <p style="padding: 24px; color: #fff">Space Math needs JavaScript turned on.</p>
    </noscript>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
